name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rdma-core \
            libibverbs-dev \
            librdmacm-dev \
            ibverbs-utils \
            clang \
            libclang-dev \
            pkg-config

      - name: Create rdmas-director stub (CI-only)
        run: |
          mkdir -p ../Rectifiers/crates/rdmas-director/src
          cat > ../Rectifiers/crates/rdmas-director/Cargo.toml << 'TOML'
          [package]
          name = "rdmas-director"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          tonic = "0.12"
          prost = "0.13"
          TOML
          cat > ../Rectifiers/crates/rdmas-director/src/lib.rs << 'RUST'
          // Stub crate for CI — not compiled unless director feature is active.
          RUST

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: "false"
          cache-all-crates: "true"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

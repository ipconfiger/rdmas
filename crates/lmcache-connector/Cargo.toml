[package]
name = "lmcache-connector"
version = "0.1.0"
edition = "2021"
description = "LMCache L2 storage adapter via one-sided RDMA"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "lmcache_rdma_connector"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# Enable auto-initialize for running tests without extension-module:
#   cargo test --no-default-features --features auto-initialize
auto-initialize = ["pyo3/auto-initialize"]

[dependencies]
# Python bindings — extension-module feature toggled via crate feature
pyo3 = { version = "0.23" }
# Core engine
rdmas = { path = "../.." }
# Key hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# Logging
tracing = "0.1"
# Error handling
thiserror = "2"
# Zero-copy
bytemuck = "1"
# System FFI for eventfd / close
libc = "0.2"
